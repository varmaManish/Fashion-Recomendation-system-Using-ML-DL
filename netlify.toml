[build]
  command = "pip install -r requirements.txt"
  publish = "frontend" # Point this to your frontend folder

[functions]
  # This ensures your 'backend' folder is bundled with the function
  included_files = ["backend/**"]

[[redirects]]
  # This sends all requests starting with /api to your Flask function
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
